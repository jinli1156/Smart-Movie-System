spring:
  config:
    import: optional:file:./.local/assistant.properties,optional:file:../.local/assistant.properties,optional:file:./.local/marketing.properties,optional:file:../.local/marketing.properties,optional:file:./.local/qwen.properties,optional:file:../.local/qwen.properties
  application:
    name: movie-ticket-backend

  # 本地直接启动时启用内嵌 Redis；部署环境可通过 spring.profiles.active 覆盖。
  profiles:
    default: dev

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/movie_ticket?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

  flyway:
    enabled: true
    locations: classpath:db/flyway
    baseline-on-migrate: true
    baseline-version: 6
    validate-on-migrate: true

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.movie.ticket.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: ${JWT_SECRET:change-this-secret-before-running}
  expiration: 604800000

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /api

# 文件上传存储配置
file:
  upload:
    path: uploads/
    access-prefix: /api/uploads/
    max-size: 5242880
    allowed-types: jpg,jpeg,png,gif,webp,bmp

# DeepSeek 密钥仅从环境变量或仓库外置的 .local 私有配置读取。
assistant:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${AI_ASSISTANT_BASE_URL:https://api.deepseek.com}
  model: ${AI_ASSISTANT_MODEL:deepseek-v4-flash}
  connect-timeout-ms: ${AI_ASSISTANT_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${AI_ASSISTANT_READ_TIMEOUT_MS:60000}

# 日志配置
listing:
  vision-api-key: ${LISTING_VISION_API_KEY:${marketing.zhipu-api-key:}}
  vision-base-url: ${LISTING_VISION_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
  vision-model: ${LISTING_VISION_MODEL:glm-4.6v-flash}
  proxy-url: ${LISTING_PROXY_URL:http://127.0.0.1:7890}

# 日志配置
logging:
  level:
    com.movie.ticket: debug
    org.springframework.security: debug
